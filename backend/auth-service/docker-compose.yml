services:

  auth-lb:
    image: nginx:latest

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - auth-service-1
      - auth-service-2

    networks:
      - service-network
      - auth-network



  auth-service-1:
    build: ./service

    env_file:
      - .env

    depends_on:
      - redis

    networks:
      - auth-network



  auth-service-2:
    build: ./service

    env_file:
      - .env

    depends_on:
      - redis

    networks:
      - auth-network



  redis:
    image: redis:latest

    networks:
      - auth-network



networks:

  auth-network:

  service-network:
    external: true